<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badminton Turnier Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* Layout: two-column court — content rail + sticky scoreboard sidebar */
        :root {
            --bg: #f3f6f4;
            --surface: #ffffff;
            --surface-sunken: #eaf1ec;
            --fg: #15241c;
            --fg-muted: #5c6f66;
            --border: #dbe5df;
            --accent: #0d7049;
            --accent-hover: #0a5a3b;
            --accent-soft: #e0f0e7;
            --success: #1f9d64;
            --warning: #b8710a;
            --warning-soft: #fbeedb;
            --danger: #c23b3b;
            --danger-soft: #fbe9e8;
            --gold-a: #e9c158; --gold-b: #f7dd8b; --gold-fg: #6b4a0a;
            --silver-a: #bcc3c9; --silver-b: #e4e8eb; --silver-fg: #3a4248;
            --bronze-a: #c3824f; --bronze-b: #e3ac7c; --bronze-fg: #3f2410;

            --font-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
            --font-body: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace;

            --radius: 14px;
            --radius-sm: 9px;
            --shadow-sm: 0 1px 2px rgba(21, 36, 28, 0.06);
            --shadow-md: 0 6px 16px -4px rgba(21, 36, 28, 0.12);
            --shadow-lg: 0 16px 36px -8px rgba(21, 36, 28, 0.18);
            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #0f1814;
                --surface: #17221d;
                --surface-sunken: #1d2b24;
                --fg: #e9f1ec;
                --fg-muted: #90a69b;
                --border: #2a3a32;
                --accent: #39bd8a;
                --accent-hover: #55cf9d;
                --accent-soft: #1e3429;
                --success: #39bd8a;
                --warning: #e2a94a;
                --warning-soft: #342b17;
                --danger: #e37972;
                --danger-soft: #3a211f;
                --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
                --shadow-md: 0 6px 16px -4px rgba(0, 0, 0, 0.4);
                --shadow-lg: 0 16px 36px -8px rgba(0, 0, 0, 0.5);
                color-scheme: dark;
            }
        }

        :root[data-theme="dark"] {
            --bg: #0f1814;
            --surface: #17221d;
            --surface-sunken: #1d2b24;
            --fg: #e9f1ec;
            --fg-muted: #90a69b;
            --border: #2a3a32;
            --accent: #39bd8a;
            --accent-hover: #55cf9d;
            --accent-soft: #1e3429;
            --success: #39bd8a;
            --warning: #e2a94a;
            --warning-soft: #342b17;
            --danger: #e37972;
            --danger-soft: #3a211f;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 6px 16px -4px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 16px 36px -8px rgba(0, 0, 0, 0.5);
            color-scheme: dark;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg);
            color: var(--fg);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));
        }

        header {
            background: var(--surface);
            padding: 20px 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            border-bottom: 3px solid var(--accent);
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 30px;
            letter-spacing: 0.01em;
            color: var(--fg);
            font-weight: 700;
            text-wrap: balance;
        }

        .button-wrapper {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 18px;
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--fg);
        }

        .btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .btn-primary {
            background: var(--accent);
            color: #ffffff;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--fg);
            border-color: var(--border);
        }

        .btn-secondary:hover {
            background: var(--surface-sunken);
        }

        .btn-danger {
            border-color: var(--danger);
            background-color: transparent;
            color: var(--danger);
        }

        .btn-danger:hover {
            background: var(--danger-soft);
        }

        .btn-success {
            background: var(--success);
            color: #ffffff;
        }

        .btn-success:hover {
            filter: brightness(0.92);
        }

        .btn-warning {
            background: var(--warning);
            color: #ffffff;
        }

        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none !important;
        }

        .grid {
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        }

        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            min-width: 0;
        }

        .card h2 {
            font-family: var(--font-display);
            font-size: 22px;
            letter-spacing: 0.01em;
            margin-bottom: 16px;
            color: var(--fg);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card h3 {
            font-size: 15px;
            margin-bottom: 12px;
            color: var(--fg-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--fg-muted);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--fg);
            font-family: var(--font-body);
            font-size: 14px;
            transition: all 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        select.form-control {
            cursor: pointer;
        }

        .player-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: var(--surface-sunken);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .pool-badge {
            background: var(--accent-soft);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }

        .sidebar {
            position: sticky;
            top: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .sidebar-links {
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            gap: 12px;
        }

        .sidebar-links h3 {
            color: var(--fg-muted);
        }

        .btn-sidebar {
            text-align: center;
            justify-content: center;
            text-decoration: none !important;
        }

        .timer-display {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 24px;
            text-align: center;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
        }

        .timer-display.expired {
            border-color: var(--danger);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(194, 59, 59, 0.35); }
            50% { box-shadow: 0 0 0 10px rgba(194, 59, 59, 0); }
        }

        .timer-time {
            font-family: var(--font-mono);
            font-size: 68px;
            font-weight: 700;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
            letter-spacing: -1px;
        }

        .timer-display.expired .timer-time {
            color: var(--danger);
        }

        .timer-milliseconds {
            font-size: 32px;
            color: var(--fg-muted);
        }

        .timer-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .timer-settings {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .time-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
        }

        .time-input {
            width: 80px;
            text-align: center;
            font-family: var(--font-mono);
        }

        .match-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .match-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px;
            transition: border-color 0.2s;
        }

        .match-item.winner-a,
        .match-item.winner-b {
            border-left-color: var(--success);
        }

        .match-item.winner-a .team-a {
            background: var(--accent-soft);
            border-color: var(--success);
        }

        .match-item.winner-b .team-b {
            background: var(--accent-soft);
            border-color: var(--success);
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .match-number {
            font-weight: 700;
            color: var(--fg-muted);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .teams-container {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .team {
            flex: 1;
            min-width: 0;
            padding: 12px;
            background: var(--surface-sunken);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            transition: all 0.2s;
        }

        .team-name {
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--fg);
        }

        .team-players {
            font-size: 14px;
            font-weight: 600;
            color: var(--fg);
            overflow-wrap: anywhere;
        }

        .vs-divider {
            font-family: var(--font-display);
            font-weight: 700;
            color: var(--fg-muted);
            font-size: 18px;
        }

        .match-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        .leaderboard-table th {
            background: var(--surface-sunken);
            padding: 12px;
            text-align: left;
            font-weight: 700;
            color: var(--fg-muted);
            border-bottom: 2px solid var(--border);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .leaderboard-table td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        .leaderboard-table tr:hover td {
            background: var(--surface-sunken);
        }

        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: 700;
            font-size: 14px;
            font-family: var(--font-mono);
        }

        .rank-1 {
            background: linear-gradient(135deg, var(--gold-a), var(--gold-b));
            color: var(--gold-fg);
        }

        .rank-2 {
            background: linear-gradient(135deg, var(--silver-a), var(--silver-b));
            color: var(--silver-fg);
        }

        .rank-3 {
            background: linear-gradient(135deg, var(--bronze-a), var(--bronze-b));
            color: var(--bronze-fg);
        }

        .rank-other {
            background: var(--surface-sunken);
            color: var(--fg-muted);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 18, 14, 0.55);
            backdrop-filter: blur(2px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex !important;
            animation: modalIn 0.15s ease-out;
        }

        @keyframes modalIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal.hidden {
            display: none !important;
        }

        .modal-content {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 24px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--fg-muted);
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }

        .modal-close:hover {
            background: var(--surface-sunken);
        }

        .preview-match {
            background: var(--surface-sunken);
            padding: 12px;
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            border: 1px solid var(--border);
        }

        .audio-config {
            background: var(--surface-sunken);
            padding: 12px;
            border-radius: var(--radius-sm);
            margin-bottom: 12px;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: inline-block;
            padding: 8px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .file-input-label:hover {
            background: var(--surface-sunken);
        }

        #stats {
            margin-bottom: 60svh;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .stat-card {
            background: var(--accent-soft);
            padding: 16px;
            border-radius: var(--radius-sm);
            text-align: center;
            border: 1px solid var(--border);
        }

        .stat-value {
            font-family: var(--font-mono);
            font-size: 30px;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-label {
            font-size: 11px;
            color: var(--fg-muted);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .score-input-group {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 8px;
        }

        .score-input {
            width: 60px;
            text-align: center;
            font-family: var(--font-mono);
        }

        .alert {
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 16px;
            font-size: 14px;
        }

        .alert-warning {
            background: var(--warning-soft);
            border: 1px solid var(--warning);
            color: var(--warning);
        }

        .alert-info {
            background: var(--accent-soft);
            border: 1px solid var(--accent);
            color: var(--accent);
        }

        @media (max-width: 768px) {
            .container {
                padding-top: 12px;
                padding-bottom: 12px;
            }

            header {
                flex-direction: column;
                align-items: stretch;
            }

            .button-wrapper {
                flex-direction: column;
            }

            .timer-time {
                font-size: 44px;
            }

            .timer-milliseconds {
                font-size: 22px;
            }

            .teams-container {
                flex-direction: column;
            }

            .vs-divider {
                transform: rotate(90deg);
            }
        }

        .hidden {
            display: none !important;
        }

        #setupScreen, #tournamentScreen {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .two-column-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 1200px) {
            .two-column-layout {
                grid-template-columns: 1fr;
            }
        }

        .popup-buttons {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
        }

        /* --- Spieler-Manager & Manuelle Runde --- */
        .player-item.inactive {
            opacity: 0.55;
            background-color: var(--surface);
            border-style: dashed;
        }
        .modal-content.large {
            max-width: 800px;
        }
        .input-small {
            padding: 4px 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            margin-right: 8px;
            background: var(--surface);
            color: var(--fg);
        }
        .manual-match-row {
            display: grid;
            grid-template-columns: 1fr 1fr auto 1fr 1fr auto;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
            background: var(--surface-sunken);
            padding: 10px;
            border-radius: var(--radius-sm);
        }
        .vs-badge {
            font-family: var(--font-display);
            font-weight: 700;
            color: var(--fg-muted);
        }

        /* Field Input Styles */
        .field-wrapper {
            margin-left: 12px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9em;
            color: var(--fg-muted);
        }
        .field-input {
            width: 40px;
            padding: 2px 4px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 14px;
            text-align: center;
            opacity: 0.5;
            transition: all 0.2s;
            background: var(--surface);
            color: var(--fg);
        }
        .field-input:focus, .field-input.filled {
            opacity: 1;
            border-color: var(--accent);
            background: var(--surface);
            font-weight: 600;
        }
</style>
</head>
<body>
